# Build without signing, for proton-dlss-nr.
#
# just_build.yml gates on an 'environment: Build' and submits the DLL to SignPath
# with a secret this fork does not have, so it cannot run here. This does the same
# MSBuild and uploads the whole output folder.
name: dlssnr-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild /m /p:Configuration=Release . /verbosity:minimal

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: optiscaler-unsigned
          # Everything the release would ship: OptiScaler.dll, the forwarder, the
          # support payload. Compressed, unlike the release workflow, so that
          # `gh run download` works instead of needing the raw zip endpoint.
          path: x64/Release/a/
          if-no-files-found: error
